<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok OAuth Callback — Vua Mặt Phố Hà Nội</title>
<style>
  body {
    background: #F7F5EF;
    color: #1A2233;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    margin: 0;
    padding: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    max-width: 560px;
    width: 100%;
    background: #FFFFFF;
    border: 1px solid #E3DECE;
    border-radius: 14px;
    padding: 32px;
  }
  h1 { font-size: 20px; color: #0F2C59; margin: 0 0 8px; }
  p { font-size: 14.5px; color: #5B6472; line-height: 1.6; }
  .code-box {
    background: #F0EDE3;
    border: 1px solid #E3DECE;
    border-radius: 10px;
    padding: 16px;
    font-family: 'Consolas', monospace;
    font-size: 14px;
    word-break: break-all;
    margin: 16px 0;
    user-select: all;
    cursor: text;
  }
  .btn {
    background: #0F2C59;
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn:hover { background: #1E3A8A; }
  .ok { color: #2E7D32; font-weight: 600; }
  .err { color: #B3261E; font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <h1 id="title">Đang xử lý...</h1>
    <p id="desc"></p>
    <div class="code-box" id="codeBox" style="display:none;"></div>
    <button class="btn" id="copyBtn" style="display:none;">Sao chép</button>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const error = params.get('error');
    const titleEl = document.getElementById('title');
    const descEl = document.getElementById('desc');
    const boxEl = document.getElementById('codeBox');
    const btnEl = document.getElementById('copyBtn');

    if (code) {
      titleEl.innerHTML = '<span class="ok">✅ Cấp quyền thành công!</span>';
      descEl.textContent = 'Sao chép mã bên dưới và dán vào cửa sổ terminal đang chờ (script tiktok_authorize.js).';
      boxEl.textContent = code;
      boxEl.style.display = 'block';
      btnEl.style.display = 'inline-block';
      btnEl.onclick = () => {
        navigator.clipboard.writeText(code);
        btnEl.textContent = 'Đã sao chép!';
      };
    } else if (error) {
      titleEl.innerHTML = '<span class="err">❌ Đã từ chối / lỗi cấp quyền</span>';
      descEl.textContent = 'Chi tiết lỗi: ' + error + ' — ' + (params.get('error_description') || '');
    } else {
      titleEl.textContent = 'Trang callback TikTok OAuth';
      descEl.textContent = 'Trang này chỉ dùng nội bộ để nhận mã xác thực (authorization code) từ TikTok khi cấp quyền cho công cụ đăng bài tự động.';
    }
  </script>
</body>
</html>
